services:
  api:
    image: solana-lending-market:prod
    build: .
    command: ["node", "--import", "tsx", "scripts/start.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      SERVICE: api
      PORT: 8787
    ports: ["127.0.0.1:8787:8787"]

  faucet:
    image: solana-lending-market:prod
    command: ["node", "--import", "tsx", "scripts/start.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      SERVICE: faucet
      PORT: 8788
      FAUCET_KEYPAIR: /run/secrets/faucet.json
    volumes:
      - ${FAUCET_KEYPAIR_FILE:?set FAUCET_KEYPAIR_FILE}:/run/secrets/faucet.json:ro
    ports: ["127.0.0.1:8788:8788"]

  keeper:
    image: solana-lending-market:prod
    command: ["node", "--import", "tsx", "scripts/start.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE: keeper
      KEEPER_KEYPAIR: /run/secrets/keeper.json
    volumes:
      - ${KEEPER_KEYPAIR_FILE:?set KEEPER_KEYPAIR_FILE}:/run/secrets/keeper.json:ro

  ingest:
    image: solana-lending-market:prod
    command: ["node", "--import", "tsx", "scripts/start.ts"]
    restart: unless-stopped
    env_file: .env
    environment:
      SERVICE: ingest

